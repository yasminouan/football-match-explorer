<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Match Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body>
  <header>
    <h1>⚽ Football Match Explorer</h1>
    <p>Coupe du monde 2022 · Données StatsBomb</p>
  </header>

  <main>
    <select id="matchSelect"></select>
    <h2 id="score"></h2>

    <div class="card">
      <h3>xG cumulé (Expected Goals)</h3>
      <canvas id="xgChart"></canvas>
    </div>
  </main>

  <footer>Données : StatsBomb Open Data</footer>
  <script src="app.js"></script>
</body>
</html>
